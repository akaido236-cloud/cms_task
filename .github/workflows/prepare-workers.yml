name: Prepare Repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify project structure
        run: |
          test -f package.json
          test -f wrangler.jsonc
          test -f open-next.config.ts
          test -d app

          echo "Project structure verified."

      - name: Fix Cloudflare Worker name
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("wrangler.jsonc")
          text = path.read_text()

          text = re.sub(
              r'"name"\s*:\s*"[^"]*"',
              '"name": "cms-task"',
              text,
              count=1
          )

          path.write_text(text)
          PY

      - name: Generate package-lock.json
        run: |
          npm install --package-lock-only --ignore-scripts

      - name: Remove obsolete ZIP archive
        run: |
          rm -f sdmedia-cloudflare-workers-cms.zip

      - name: Show final configuration
        run: |
          echo "===== WRANGLER CONFIG ====="
          cat wrangler.jsonc

          echo ""
          echo "===== PACKAGE LOCK ====="
          test -f package-lock.json && echo "package-lock.json exists"

      - name: Commit repository changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package-lock.json wrangler.jsonc

          if git diff --cached --quiet; then
            echo "No repository changes detected."
            exit 0
          fi

          git commit -m "Prepare project for Cloudflare Workers deployment"
          git push          echo ""
          echo "===== WORKFLOWS ====="
          ls -la .github/workflows

          echo ""
          echo "===== WRANGLER CONFIG ====="
          cat wrangler.jsonc

      - name: Commit repository preparation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Prepare project for Cloudflare Workers deployment"
          git push
