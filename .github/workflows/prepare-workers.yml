name: Prepare Repository for Cloudflare Workers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify project structure
        run: |
          test -f package.json
          test -f wrangler.jsonc
          test -f open-next.config.ts
          test -d app

          echo "Project structure verified."

      - name: Remove old Cloudflare Pages workflow
        run: |
          rm -f .github/workflows/deploy.yml

      - name: Fix Cloudflare Worker configuration
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("wrangler.jsonc")
          text = path.read_text()

          text = re.sub(
              r'"name"\s*:\s*"[^"]*"',
              '"name": "cms-task"',
              text,
              count=1
          )

          path.write_text(text)
          PY

      - name: Generate package-lock.json
        run: |
          npm install --package-lock-only --ignore-scripts

      - name: Create Cloudflare Workers deployment workflow
        run: |
          cat > .github/workflows/deploy-workers.yml <<'YAML'
          name: Deploy SD Media to Cloudflare Workers

          on:
            push:
              branches:
                - main
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            deploy:
              runs-on: ubuntu-latest

              steps:
                - name: Checkout repository
                  uses: actions/checkout@v4

                - name: Setup Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: 20
                    cache: npm

                - name: Install dependencies
                  run: npm ci

                - name: Build and deploy to Cloudflare Workers
                  run: npm run deploy
                  env:
                    CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                    CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          YAML

      - name: Remove obsolete ZIP archive
        run: |
          rm -f sdmedia-cloudflare-workers-cms.zip

      - name: Show final structure
        run: |
          echo "===== ROOT FILES ====="
          ls -la

          echo ""
          echo "===== WORKFLOWS ====="
          ls -la .github/workflows

          echo ""
          echo "===== WRANGLER CONFIG ====="
          cat wrangler.jsonc

      - name: Commit repository preparation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Prepare project for Cloudflare Workers deployment"
          git push
